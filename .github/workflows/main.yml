
name: Build Mahaboob Online Services APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q Mahaboob_Android_Source2.zip -d android-source

      - name: Build APK
        run:  gradle -p android-source/Mahaboob_Android_Source2/MahaboobOnlineServicesAndroid assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahaboob-Online-Services-APK
          path: android-source/Mahaboob_Android_Source2/MahaboobOnlineServicesAndroid/app/build/outputs/apk/debug/*.apk
